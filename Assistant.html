<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>私人助理小乖</title>
<style>
:root{--bg:#15120E;--card:#1E1A14;--gold:#C9A56A;--gold2:#F1DFB4;--ink:#F3EBDD;--soft:#A89B84;--line:rgba(220,195,148,.22)}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--bg:#F6F1E7;--card:#FFFDF8;--gold:#9A7440;--gold2:#6B4F25;--ink:#2A2418;--soft:#7A6C55;--line:rgba(120,95,55,.25)}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:0 30px 60px -28px rgba(0,0,0,.6);text-align:center}
.mark{font-family:"Noto Serif TC",serif;letter-spacing:4px;color:var(--gold);font-size:20px;margin:0 0 6px}
.sub{color:var(--soft);font-size:14px;margin:0 0 22px;line-height:1.7}
.field{display:block;width:100%;box-sizing:border-box;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px;padding:0 14px;margin-top:10px;outline:none}
.field:focus{border-color:var(--gold)}
button.go{width:100%;height:46px;margin-top:16px;border:none;border-radius:12px;background:linear-gradient(180deg,#D9B985,#B8905A);color:#1A150D;font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--gold2)}
.hide{display:none}
</style>
</head>
<body>
<div class="box">
  <p class="mark">私人助理小乖</p>
  <p class="sub" id="intro">請輸入同步密碼，才能進入小乖主頁。</p>
  <form id="gate" autocomplete="off">
    <input class="field hide" id="url" type="url" placeholder="小乖網址（…/exec）">
    <input class="field" id="pw" type="password" placeholder="同步密碼" autocomplete="current-password">
    <button class="go" id="go" type="submit">進入</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
(function(){
  var STORE_KEY = "xiaoguai_v1";      // 小乖主頁原本的設定（網址、同步密碼）
  var GATE_KEY  = "xg_gate_v1";       // 當天解鎖記錄：日期＋主頁內容
  var TIMEOUT_MS = 25000;             // 超過這個時間沒回應就停止等待
  var $ = function(id){ return document.getElementById(id); };

  function today(){ var d = new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
  function readStore(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch(e){ return {}; } }
  function writeStore(a){ try { localStorage.setItem(STORE_KEY, JSON.stringify(a)); } catch(e){} }
  function readGate(){
    try {
      var g = JSON.parse(localStorage.getItem(GATE_KEY) || "null");
      return (g && g.day === today() && g.html) ? g.html : null;
    } catch(e){ return null; }
  }
  // 登錄成功：記下網址與密碼（給小乖主頁用），並記下今天的主頁內容
  function saveUnlock(url, key, html){
    var a = readStore(); a.syncUrl = url; a.syncKey = key; writeStore(a);
    try { localStorage.setItem(GATE_KEY, JSON.stringify({ day: today(), html: html })); } catch(e){}
  }
  // 密碼錯誤：清掉密碼與當天記錄，要重新輸入
  function clearUnlock(){
    try { localStorage.removeItem(GATE_KEY); } catch(e){}
    var a = readStore(); a.syncKey = ""; writeStore(a);
  }
  function showMsg(t){ $("msg").textContent = t || ""; }
  function busy(on){ $("go").disabled = on; $("go").textContent = on ? "開啟中…" : "進入"; }
  // 小乖主頁（含對話頁）固定尺寸：不能雙指放大縮小。iPhone Safari 會忽略 user-scalable=no，所以另外擋住多指手勢。
  function lockZoom(html){
    var vp = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">';
    var out = /<meta[^>]+name=["']viewport["'][^>]*>/i.test(html) ? html.replace(/<meta[^>]+name=["']viewport["'][^>]*>/i, vp) : html.replace(/<head([^>]*)>/i, function(m){ return m + vp; });
    var guard = '<style>html,body{touch-action:pan-x pan-y;}</style>' +
      '<script>(function(){' +
      'document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});' +
      '["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});' +
      '})();<\/script>';
    return out.replace(/<\/head>/i, guard + '</head>');
  }
  function show(html){ document.open(); document.write(lockZoom(html)); document.close(); }

  function openApp(url, key){
    busy(true); showMsg("");
    var base = url.replace(/\?.*$/, "");
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
    fetch(base, {
      method: "POST",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify({action: "assistant", key: key}),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.text(); }).then(function(html){
      clearTimeout(timer);
      if (html.indexOf("<html") < 0) {
        clearUnlock();
        busy(false);
        showMsg(html.indexOf("同步密碼不對") >= 0 ? "同步密碼不對，請重新輸入" : (html.slice(0, 120) || "小乖主頁暫時打不開，請稍後再試"));
        $("pw").value = ""; $("pw").focus();
        return;
      }
      saveUnlock(base, key, html);
      show(html);
    }).catch(function(e){
      clearTimeout(timer);
      busy(false);
      showMsg(e && e.name === "AbortError" ? "連線太久沒有回應，請再按一次「進入」" : "連線有問題，請再試一次");
    });
  }

  $("gate").addEventListener("submit", function(e){
    e.preventDefault();
    var a = readStore();
    var url = ($("url").value || a.syncUrl || "").trim();
    var key = $("pw").value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { showMsg("請先填入小乖網址（https://script.google.com/… 結尾是 /exec）"); $("url").classList.remove("hide"); return; }
    if (!key) { showMsg("請輸入同步密碼"); return; }
    openApp(url, key);
  });

  // 今天已經登錄過：直接開啟，不用再輸入
  var a = readStore();
  if (a.syncUrl && a.syncKey) {
    var cached = readGate();
    if (cached) { show(cached); return; }
    openApp(a.syncUrl, a.syncKey);
  } else {
    $("url").classList.remove("hide");
    $("url").value = a.syncUrl || "";
    $("pw").focus();
  }
})();
</script>
</body>
</html>
