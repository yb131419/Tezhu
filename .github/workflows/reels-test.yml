# 剪片程式有改時，在 GitHub 上實際剪一支測試影片，確認中文字幕真的有畫上去（Reels 和大片各一次）
name: 剪片自我測試
on:
  push:
    paths: [reels/**, .github/workflows/reels-test.yml, .github/workflows/reels.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reels
      - name: 去背模型（環繞特效用，存起來下次不用再下載）
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use

      - name: 安裝 ffmpeg 與中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          python3 -m pip install -q --break-system-packages edge-tts==7.3.1   # 台灣腔配音（微軟台灣聲音）
          python3 -m pip install -q --break-system-packages opencv-python-headless onnxruntime   # 環繞／標題牆卡片特效（人像去背）
          fc-cache -f > /dev/null
      - name: 台灣腔配音能產生
        run: python3 -m edge_tts --voice zh-TW-HsiaoChenNeural --text 早安，今天也要好好照顧自己 --write-media /tmp/vo.mp3 && test -s /tmp/vo.mp3
      - name: 剪 Reels（直式）
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30:d=12 -f lavfi -i sine=d=12 -c:v libx264 -c:a aac /tmp/in.mp4
          python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/r.mp4 --selftest
          ls reels/music
      - name: 教學框（口播、手機直式畫面）
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=720x1280:rate=30:d=12 -f lavfi -i sine=d=12 -c:v libx264 -c:a aac /tmp/p.mp4
          python3 reels/reels.py --input /tmp/p.mp4 --transcript reels/selftest.json --note "剪 Reels 教學框" --out /tmp/f.mp4 --selftest
      - name: 剪大片（橫式）
        run: python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/l.mp4 --mode long --selftest
      - name: 好幾支影片接起來剪
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=720x1280:rate=24:d=6 -c:v libx264 /tmp/v2.mp4
          python3 reels/reels.py --input /tmp/in.mp4,/tmp/v2.mp4 --transcript reels/selftest.json --out /tmp/m.mp4 --selftest
      - name: 照時間軸重剪（使用者調整段落後，只留下的段落、字幕照舊）
        run: |
          python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/t1.mp4 --timeline-out /tmp/tl.json --selftest
          python3 -c "import json;t=json.load(open('/tmp/tl.json'));t['spans']=[[0.0,3.0],[5.0,8.0]];json.dump(t,open('/tmp/tl2.json','w'),ensure_ascii=False)"
          TIMELINE="$(cat /tmp/tl2.json)" python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/t2.mp4 --selftest
          test "$(python3 -c "import subprocess;print(int(float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','/tmp/t2.mp4']))))")" = 6
      - name: 照時間軸搬移與變速重剪（字幕要跟著段落對上，字幕檢查要過）
        run: |
          python3 -c "import json;t=json.load(open('/tmp/tl.json'));t['spans']=[[5.0,8.0],[0.0,3.0,2.0]];json.dump(t,open('/tmp/tl3.json','w'),ensure_ascii=False)"
          TIMELINE="$(cat /tmp/tl3.json)" python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/t3.mp4 --selftest
          python3 -c "import subprocess;d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','/tmp/t3.mp4']));assert 4.0<=d<=5.0,d"
      - name: 靜音剪（配樂卡點、轉場、運鏡、文字動畫）
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30:d=40 -c:v libx264 /tmp/sil.mp4
          python3 reels/reels.py --input /tmp/sil.mp4 --transcript reels/selftest_silent.json --kind silent --out /tmp/s.mp4 --selftest
      - name: 教學框（靜音、橫的畫面）
        run: python3 reels/reels.py --input /tmp/sil.mp4 --transcript reels/selftest_silent.json --kind silent --note 教學框 --out /tmp/fs.mp4 --selftest
      - name: 靜音剪大片
        run: python3 reels/reels.py --input /tmp/sil.mp4 --transcript reels/selftest_silent.json --kind silent --mode long --out /tmp/sl.mp4 --selftest
      - name: 照片 Reels（好幾張照片、直橫都有）
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=1200x1600 -frames:v 1 /tmp/a.jpg
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=1600x1000 -frames:v 1 /tmp/b.jpg
          ffmpeg -y -loglevel error -f lavfi -i smptebars=size=1080x1080 -frames:v 1 /tmp/c.jpg
          python3 reels/reels.py --input /tmp/a.jpg,/tmp/b.jpg,/tmp/c.jpg --transcript reels/selftest_silent.json --note "每張3秒" --out /tmp/ph.mp4 --selftest
      - name: 照片和影片混在一起
        run: python3 reels/reels.py --input /tmp/a.jpg,/tmp/v2.mp4 --transcript reels/selftest_silent.json --kind silent --out /tmp/pm.mp4 --selftest
      - name: 環繞卡片特效（截圖繞著人轉）和標題牆
        run: |
          python3 reels/reels.py --input /tmp/v2.mp4,/tmp/a.jpg,/tmp/b.jpg,/tmp/c.jpg --transcript reels/selftest_silent.json --kind silent --note "環繞 第1到4秒" --out /tmp/orb.mp4 --selftest
          python3 reels/reels.py --input /tmp/in.mp4,/tmp/a.jpg,/tmp/b.jpg --transcript reels/selftest.json --mode long --note "標題牆 第2到5秒" --out /tmp/wall.mp4 --selftest
