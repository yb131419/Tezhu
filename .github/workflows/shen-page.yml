# 神劇本頁自動更新：每次 Code.gs（標題、說明清單）或 shen/ 內的劇本檔有更新，就重新產生 ShenScripts.html，
# 並推回 main，GitHub Pages 會自動上線。產生程式：tools/build_shen_from_repo.py
name: 神劇本頁自動更新

on:
  push:
    branches: [main]
    paths:
      - 'line-bot/Code.gs'
      - 'shen/**'
      - 'tools/build_shen_from_repo.py'
      - 'tools/build_shen_scripts.py'
      - 'tools/export_plans.py'
      - '.github/workflows/shen-page.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shen-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 重新產生神劇本頁
        run: python3 tools/build_shen_from_repo.py

      # 小乖每天自動更新 YouTube 時，讀的是這份計畫表（從 Code.gs 匯出，不用重貼 Code.gs）
      - name: 匯出標題、說明、標記計畫表
        run: python3 tools/export_plans.py

      - name: 有變動才推回 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ShenScripts.html shen-latest.json shen-plans.json
          if git diff --cached --quiet; then
            echo "劇本頁沒有變動"
          else
            git commit -m "神劇本頁自動更新（依最新標題、影片說明與播放清單連結重新產生）"
            git push origin HEAD:main
          fi
