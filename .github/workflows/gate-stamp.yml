# 小乖主頁版本標示自動更新：每次 Assistant.html 有更新，就重新產生版本短碼與時間，推回 main。
name: 小乖主頁版本標示

on:
  push:
    branches: [main]
    paths:
      - 'Assistant.html'
      - 'tools/stamp_gate.py'
      - '.github/workflows/gate-stamp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate-stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 更新版本標示
        run: python3 tools/stamp_gate.py Assistant.html

      - name: 有變動才推回 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assistant.html
          if git diff --cached --quiet; then
            echo "版本標示沒有變動"
          else
            git commit -m "小乖主頁版本標示自動更新"
            git push origin HEAD:main
          fi
