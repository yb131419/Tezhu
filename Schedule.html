<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12100D">
<title>小乖行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12100D;
    --bg-2:#1B1813;
    --bg-3:#25211B;
    --gold:#F1DFB4;
    --gold-2:#C9A56A;
    --gold-3:#E9D3A2;
    --text:#F4EBDA;
    --text-2:#B9AD96;
    --text-3:#7D7463;
    --line:rgba(201,165,106,.22);
    --danger:#D98A6B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0;background:var(--bg);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:16px;
    line-height:1.6;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 460px at 50% -10%, rgba(201,165,106,.16), transparent 62%),
      linear-gradient(180deg,var(--bg-2),var(--bg) 42%);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button,input{font-family:inherit;color:inherit;}
  button{cursor:pointer;border:none;background:none;}

  .wrap{max-width:520px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 120px);}
  header{padding:calc(env(safe-area-inset-top) + 26px) 4px 6px;}
  .eyebrow{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.32em;color:var(--gold-2);text-transform:uppercase;}
  .head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  h1{font-family:"Noto Serif TC",serif;font-weight:600;font-size:30px;margin:4px 0 2px;color:var(--gold);}
  .sub{color:var(--text-2);font-size:14px;margin:0;}
  .reload{flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--text-2);font-size:14px;}

  .seg{display:flex;gap:6px;margin:18px 0 6px;background:var(--bg-3);border:1px solid var(--line);border-radius:999px;padding:4px;}
  .seg button{flex:1;height:42px;border-radius:999px;color:var(--text-2);font-size:15px;}
  .seg button.on{background:linear-gradient(135deg,var(--gold-3),var(--gold-2));color:#2A2118;font-weight:600;}

  .day{font-family:"Noto Serif TC",serif;color:var(--gold-2);font-size:14px;letter-spacing:.05em;margin:22px 4px 8px;}
  .card{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
    background:linear-gradient(160deg,#211D16,#17140F);border:1px solid var(--line);border-radius:18px;
    padding:15px 16px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .15s;}
  .card:active{transform:scale(.985);}
  .time{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--gold);min-width:66px;line-height:1.2;padding-top:1px;font-variant-numeric:lining-nums;}
  .ti{font-size:17px;font-weight:600;color:var(--text);word-break:break-word;}
  .pl{font-size:14px;color:var(--text-2);margin-top:3px;word-break:break-word;}
  .empty,.loading{color:var(--text-3);text-align:center;padding:48px 0;}

  .fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:62px;height:62px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-3),var(--gold-2));color:#2A2118;font-size:32px;line-height:1;
    box-shadow:0 12px 30px rgba(201,165,106,.35);display:flex;align-items:center;justify-content:center;z-index:20;}

  .bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:30;}
  .sheet{width:100%;max-width:520px;background:var(--bg-2);border:1px solid var(--line);border-bottom:none;
    border-radius:26px 26px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;
    animation:up .28s cubic-bezier(.22,.8,.36,1);}
  @keyframes up{from{transform:translateY(40px);opacity:0;}}
  .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px;}
  h2{font-family:"Noto Serif TC",serif;color:var(--gold);font-size:22px;font-weight:600;margin:0 0 6px;}
  label{display:block;font-size:13px;color:var(--text-2);margin:14px 0 6px;letter-spacing:.04em;}
  input[type=text],input[type=date],input[type=time],input[type=url],input[type=password]{
    width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);
    padding:0 14px;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;}
  input[type=date],input[type=time]{min-width:0;}
  input:focus{border-color:var(--gold-2);}
  input:disabled{opacity:.4;}
  .allday{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--text-2);font-size:15px;}
  .allday input{width:20px;height:20px;accent-color:var(--gold-2);}
  .allday label{margin:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btns{display:flex;gap:10px;margin-top:22px;}
  .btn{flex:1;height:52px;border-radius:16px;font-size:16px;font-weight:600;}
  .btn.gold{background:linear-gradient(135deg,var(--gold-3),var(--gold-2));color:#2A2118;}
  .btn.gold:disabled{opacity:.5;}
  .btn.ghost{border:1px solid var(--line);color:var(--text-2);}
  .btn.del{flex:0 0 96px;color:var(--danger);border:1px solid rgba(217,138,107,.35);}
  .hint{font-size:13px;color:var(--text-3);margin-top:12px;line-height:1.7;}
  .err{color:var(--danger);font-size:14px;margin-top:12px;min-height:1em;}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);
    background:var(--bg-3);border:1px solid var(--line);padding:10px 18px;border-radius:999px;color:var(--gold);
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Schedule</div>
    <div class="head-row">
      <div>
        <h1>行程</h1>
        <p class="sub">查看、新增、修改、刪除，手機上一次搞定</p>
      </div>
      <button class="reload" id="reload" hidden>↻ 重新讀取</button>
    </div>
  </header>

  <!-- 第一次開：貼上同步網址與密碼（跟小乖主頁的設定相同，同一台手機會自動沿用） -->
  <section id="setup" hidden>
    <div class="sheet" style="border-radius:24px;border:1px solid var(--line);margin-top:18px;max-width:none;animation:none;">
      <h2>連到你的小乖</h2>
      <p class="hint">請貼上 Apps Script 網址與同步密碼。如果你已經在這台手機的小乖主頁設定過，就不用再貼一次。</p>
      <label for="sUrl">Apps Script 網址</label>
      <input id="sUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
      <label for="sKey">同步密碼</label>
      <input id="sKey" type="password" autocomplete="off" spellcheck="false">
      <div class="err" id="sErr"></div>
      <div class="btns"><button class="btn gold" id="sSave">連線</button></div>
    </div>
  </section>

  <section id="main" hidden>
    <div class="seg">
      <button id="tabNext" class="on">接下來</button>
      <button id="tabPast">過去</button>
    </div>
    <div id="list"><div class="loading">讀取中…</div></div>
  </section>
</div>

<button class="fab" id="addBtn" aria-label="新增行程" hidden>＋</button>
<div class="bg" id="bg" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const STORE = "xiaoguai_v1";      // 跟小乖主頁共用同一份設定（只讀寫 syncUrl、syncKey 兩個欄位）
const WEEK = ["日","一","二","三","四","五","六"];
const $ = id => document.getElementById(id);
let cfg = readCfg();
let events = [];
let tab = "next";
let editId = null;
let toastT = 0;

function readCfg(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE) || "{}") || {};
    return { url: s.syncUrl || "", key: s.syncKey || "" };
  }catch(e){ return { url: "", key: "" }; }
}
function saveCfg(url, key){
  // 私密瀏覽或瀏覽器封鎖儲存時，寫不進去也沒關係，只是下次要再貼一次
  try{
    let s = {};
    try{ s = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }catch(e){}
    s.syncUrl = url; s.syncKey = key;
    localStorage.setItem(STORE, JSON.stringify(s));
  }catch(e){}
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function pad(n){ return ("0" + n).slice(-2); }
function todayStr(){
  const n = new Date();
  return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate());
}
function dayLabel(ds){
  const [y, m, d] = ds.split("-").map(Number);
  const w = WEEK[new Date(y, m - 1, d).getDay()];
  return m + "/" + d + "（週" + w + "）" + (ds === todayStr() ? "・今天" : "");
}
function cmp(a, b){
  return (a.date + (a.time || "00:00")).localeCompare(b.date + (b.time || "00:00"));
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 1800);
}

// 所有讀寫都走 Apps Script 的同步端點（text/plain 避免跨網域預檢）
async function api(body){
  const res = await fetch(cfg.url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...body, key: cfg.key })
  });
  const out = await res.json();
  if(!out.ok) throw new Error(out.error || "連線失敗");
  return out;
}

async function loadAll(){
  const out = await api({ action: "evList" });
  events = out.events || [];
  render();
}

function showMain(){
  $("setup").hidden = true;
  $("main").hidden = false;
  $("addBtn").hidden = false;
  $("reload").hidden = false;
}
function showSetup(msg){
  $("main").hidden = true;
  $("addBtn").hidden = true;
  $("reload").hidden = true;
  $("setup").hidden = false;
  $("sUrl").value = cfg.url;
  $("sKey").value = cfg.key;
  $("sErr").textContent = msg || "";
}

function render(){
  const t = todayStr();
  $("tabNext").classList.toggle("on", tab === "next");
  $("tabPast").classList.toggle("on", tab === "past");
  let list = events.filter(e => tab === "next" ? e.date >= t : e.date < t).sort(cmp);
  if(tab === "past") list.reverse();
  if(!list.length){
    $("list").innerHTML = `<div class="empty">${tab === "next" ? "接下來沒有行程" : "沒有過去的行程"}</div>`;
    return;
  }
  let html = "", last = "";
  list.forEach(e => {
    if(e.date !== last){ html += `<div class="day">${esc(dayLabel(e.date))}</div>`; last = e.date; }
    html += `<button class="card" data-id="${esc(e.id)}">
      <div class="time">${e.time ? esc(e.time) : "整天"}</div>
      <div><div class="ti">${esc(e.title)}</div>${e.place ? `<div class="pl">📍 ${esc(e.place)}</div>` : ""}</div>
    </button>`;
  });
  $("list").innerHTML = html;
}

function openForm(ev){
  editId = ev ? ev.id : null;
  const v = ev || { title: "", date: todayStr(), time: "", place: "" };
  $("sheet").innerHTML = `
    <div class="grab"></div>
    <h2>${ev ? "修改行程" : "新增行程"}</h2>
    <label for="fT">行程名稱</label>
    <input id="fT" type="text" maxlength="80" placeholder="例如：牙醫回診" value="${esc(v.title)}">
    <label for="fD">日期</label>
    <input id="fD" type="date" value="${esc(v.date)}">
    <div class="allday"><input id="fA" type="checkbox" ${v.time ? "" : "checked"}><label for="fA">整天</label></div>
    <label for="fTm">時間</label>
    <input id="fTm" type="time" value="${esc(v.time || "")}" ${v.time ? "" : "disabled"}>
    <label for="fP">地點（選填）</label>
    <input id="fP" type="text" maxlength="80" value="${esc(v.place || "")}">
    <div class="hint">有填時間的行程，會在開始前 30 分鐘與 1 小時前，由 LINE、Telegram 提醒你。</div>
    <div class="err" id="fE"></div>
    <div class="btns">
      ${ev ? '<button class="btn del" id="fDel">刪除</button>' : ""}
      <button class="btn ghost" id="fC">取消</button>
      <button class="btn gold" id="fS">儲存</button>
    </div>`;
  $("bg").hidden = false;
  $("fA").onchange = () => { $("fTm").disabled = $("fA").checked; };
  $("fC").onclick = closeForm;
  $("fS").onclick = save;
  if(ev) $("fDel").onclick = del;
  if(!ev) setTimeout(() => $("fT").focus(), 50);
}
function closeForm(){
  $("bg").hidden = true;
  editId = null;
}

async function save(){
  const title = $("fT").value.trim();
  const date = $("fD").value;
  const allDay = $("fA").checked;
  const time = allDay ? "" : $("fTm").value;
  const place = $("fP").value.trim();
  if(!title){ $("fE").textContent = "請填行程名稱"; return; }
  if(!date){ $("fE").textContent = "請選日期"; return; }
  if(!allDay && !time){ $("fE").textContent = "請選時間，或勾選「整天」"; return; }
  $("fS").disabled = true;
  try{
    const out = await api({ action: "evSave", id: editId || undefined, title, date, time, place });
    const i = events.findIndex(e => e.id === out.event.id);
    if(i >= 0) events[i] = out.event; else events.push(out.event);
    closeForm();
    render();
    toast("已儲存");
  }catch(e){
    $("fE").textContent = "儲存失敗：" + e.message;
    $("fS").disabled = false;
  }
}

async function del(){
  const id = editId;
  if(!id) return;
  if(!confirm("確定要刪除這筆行程嗎？")) return;
  try{
    await api({ action: "evDel", id });
    events = events.filter(e => e.id !== id);
    closeForm();
    render();
    toast("已刪除");
  }catch(e){
    $("fE").textContent = "刪除失敗：" + e.message;
  }
}

$("tabNext").onclick = () => { tab = "next"; render(); };
$("tabPast").onclick = () => { tab = "past"; render(); };
$("addBtn").onclick = () => openForm(null);
$("bg").onclick = e => { if(e.target === $("bg")) closeForm(); };
$("list").onclick = e => {
  const b = e.target.closest("[data-id]");
  if(!b) return;
  const ev = events.find(x => x.id === b.dataset.id);
  if(ev) openForm(ev);
};
$("reload").onclick = async () => {
  try{ await loadAll(); toast("已更新"); }
  catch(e){ toast("讀取失敗：" + e.message); }
};
$("sSave").onclick = async () => {
  const url = $("sUrl").value.trim();
  const key = $("sKey").value.trim();
  if(!/^https:\/\/script\.google\.com\//.test(url)){ $("sErr").textContent = "網址要以 https://script.google.com/ 開頭"; return; }
  if(!key){ $("sErr").textContent = "請填同步密碼"; return; }
  const old = cfg;
  cfg = { url, key };
  $("sSave").disabled = true;
  try{
    await loadAll();
    saveCfg(url, key);
    showMain();
  }catch(e){
    cfg = old;
    $("sErr").textContent = "連線失敗：" + e.message;
  }finally{
    $("sSave").disabled = false;
  }
};

(async function init(){
  if(!cfg.url || !cfg.key){ showSetup(); return; }
  showMain();
  try{ await loadAll(); }
  catch(e){ showSetup("連線失敗：" + e.message); }
})();
</script>
</body>
</html>
